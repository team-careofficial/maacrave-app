# Render Blueprint — Dashboard → New → Blueprint → pick this repo.
# Secrets marked `sync: false` are asked for once, in the Render dashboard (never stored in GitHub).
services:
  - type: web
    name: maacrave-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate --accept-data-loss && node dist/main.js   # TODO before public launch: switch to prisma migrate deploy
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: development      # switch to production once SMS + email are configured
      - key: DATABASE_URL
        sync: false             # Neon connection string, without quotes
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false             # e.g. https://maacrave-app.vercel.app
      - key: API_PUBLIC_URL
        sync: false             # e.g. https://maacrave-api.onrender.com
      - key: SMS_PROVIDER
        value: log
      - key: EMAIL_PROVIDER
        value: log              # brevo on Render (free plan blocks Gmail SMTP)
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false             # who may open the admin panel, comma separated
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_IDS
        sync: false             # Google OAuth client IDs for "Continue with Google", comma separated
