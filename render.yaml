# Render Blueprint — Dashboard → New → Blueprint → pick this repo.
# Secrets marked `sync: false` are asked for once, in the Render dashboard (never stored in GitHub).
services:
  - type: web
    name: maacrave-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # Adds new tables/columns on each deploy. Without --accept-data-loss a change that would delete data stops the deploy
    # instead (the old version keeps running), so no customer data can be wiped by accident.
    startCommand: npx prisma db push --skip-generate && node dist/main.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Values you set in the Render dashboard. They are listed here without a value so a
      # Blueprint sync never overwrites them (it used to reset EMAIL_PROVIDER to "log").
      - key: NODE_ENV
        sync: false             # development while testing, production when SMS + email work
      - key: DATABASE_URL
        sync: false             # Neon connection string, without quotes
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false             # e.g. https://maacrave-app.vercel.app
      - key: API_PUBLIC_URL
        sync: false             # e.g. https://maacrave-api.onrender.com
      - key: SMS_PROVIDER
        sync: false             # log | bulksmsbd
      - key: EMAIL_PROVIDER
        sync: false             # brevo on Render (free plan blocks Gmail SMTP)
      - key: EMAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false             # who may open the admin panel, comma separated
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_IDS
        sync: false             # Google OAuth client IDs for "Continue with Google", comma separated
