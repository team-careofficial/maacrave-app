name: Android APK
# Builds an installable Android app (APK) and publishes it as the "android-latest" GitHub release,
# so anyone can download it from https://github.com/<owner>/<repo>/releases/latest
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: android-apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: app } }
    env:
      EXPO_PUBLIC_API_URL: https://maacrave-api.onrender.com/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Align native packages with Expo SDK 52
        run: npx expo install --fix -- --legacy-peer-deps
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Signing key
        # Uses the permanent key from the ANDROID_KEYSTORE_BASE64 secret when it exists (so updates install over the old app).
        # Without it, the build is signed with a temporary key: fine for testing, but people must uninstall before updating.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/maacrave.keystore
            cat >> android/gradle.properties <<PROPS
          MAACRAVE_STORE_FILE=maacrave.keystore
          MAACRAVE_KEY_ALIAS=maacrave
          MAACRAVE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MAACRAVE_KEY_PASSWORD=$KEYSTORE_PASSWORD
          PROPS
            node -e "
              const fs=require('fs');const p='android/app/build.gradle';let s=fs.readFileSync(p,'utf8');
              s=s.replace(/signingConfigs \{/, 'signingConfigs {\n        release {\n            storeFile file(MAACRAVE_STORE_FILE)\n            storePassword MAACRAVE_STORE_PASSWORD\n            keyAlias MAACRAVE_KEY_ALIAS\n            keyPassword MAACRAVE_KEY_PASSWORD\n        }');
              s=s.replace(/(release \{[^}]*?)signingConfig signingConfigs\.debug/, '\$1signingConfig signingConfigs.release');
              fs.writeFileSync(p,s);"
            echo "Signed with the permanent MaaCrave key"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — signing with a temporary key"
          fi
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
      - name: Name the file
        run: |
          mkdir -p ../dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk ../dist-apk/MaaCrave.apk
          ls -lh ../dist-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MaaCrave Android (latest)
          make_latest: true
          body: |
            Latest MaaCrave Android app, built from `${{ github.sha }}`.
            Download **MaaCrave.apk** below on your Android phone and open it to install
            (allow "Install unknown apps" for your browser when asked).
          files: dist-apk/MaaCrave.apk
